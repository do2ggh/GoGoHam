source /boot/grub/config.cfg

menuentry "GoGoHam (Deutsch)" --hotkey=d {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ locales=de_DE.UTF-8 keyboard-layouts=de timezone=Europe/Berlin
	initrd @INITRD_LIVE@
}

menuentry "GoGoHam (English)" --hotkey=e {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ locales=en_US.UTF-8 keyboard-layouts=us timezone=Etc/UTC
	initrd @INITRD_LIVE@
}

menuentry "GoGoHam - Notstart, einfache Grafik / safe graphics" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ locales=de_DE.UTF-8 keyboard-layouts=de timezone=Europe/Berlin nomodeset
	initrd @INITRD_LIVE@
}
