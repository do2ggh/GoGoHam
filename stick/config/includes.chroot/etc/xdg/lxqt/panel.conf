# GoGoHam-Live-Stick: Leiste unten – einfach gehalten (keine Arbeitsflächen-Umschaltung)
[General]
iconTheme=Papirus-Dark

[mainmenu]
alignment=Left
icon=/usr/share/icons/hicolor/64x64/apps/gogoham.png
ownIcon=true
type=fancymenu

[quicklaunch]
alignment=Left
apps\1\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\2\desktop=/usr/share/applications/qterminal.desktop
apps\3\desktop=/usr/share/applications/firefox-esr.desktop
apps\size=3
type=quicklaunch

[kbindicator]
alignment=Right
type=kbindicator

[quicklaunch2]
alignment=Right
apps\1\desktop=/usr/local/share/applications/gogoham-herunterfahren.desktop
apps\size=1
type=quicklaunch

[panel1]
plugins=mainmenu, showdesktop, quicklaunch, taskbar, kbindicator, tray, statusnotifier, mount, volume, worldclock, quicklaunch2

[taskbar]
buttonWidth=220
raiseOnCurrentDesktop=true
