# GoGoHam-Live-Stick: Uhr mit dem Internet abgleichen, sobald es da ist.
# Bewusst OHNE „rtcsync“: Die eingebaute Uhr des Rechners wird nie verändert – der Rechner gehört
# oft jemand anderem, und sein Windows/Linux soll danach die gewohnte Zeit haben.
pool 2.debian.pool.ntp.org iburst
sourcedir /run/chrony-dhcp
sourcedir /etc/chrony/sources.d
confdir /etc/chrony/conf.d
keyfile /etc/chrony/chrony.keys
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony
maxupdateskew 100.0
# fremde Rechner können Stunden danebenliegen: immer sofort stellen, nicht langsam angleichen
makestep 1 -1
leapsectz right/UTC
